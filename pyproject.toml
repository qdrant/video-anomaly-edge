[project]
name = "video-anomaly"
version = "0.1.0"
description = "Video anomaly detection using VideoMAE V2 and kNN scoring on AWS"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "transformers>=4.44.0",
    "timm>=1.0.0",
    "qdrant-client>=1.12.0",
    "python-dotenv>=1.0.0",
    "scipy>=1.14.0",
    "scikit-learn>=1.5.0",
    "numpy>=1.26.0",
    "pillow>=12.3.0",
    "decord>=0.6.0; sys_platform != 'darwin'",
    "av>=13.0.0",
    "boto3>=1.35.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
    "qdrant-edge-py>=0.5.0",
    "persist-queue>=1.1.0",
    "twelvelabs>=0.4.0",
    "aiohttp>=3.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["backend", "edge"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
