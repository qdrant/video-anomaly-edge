services:
  model-server:
    image: ${ECR_REGISTRY}/model-server:latest
    ports:
      - "9877:9877"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9877/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - anomaly-net

  backend:
    image: ${ECR_REGISTRY}/backend:latest
    ports:
      - "9876:9876"
    env_file: .env
    environment:
      MODEL_SERVER_URL: http://model-server:9877
      QDRANT_URL: http://qdrant:6333
    depends_on:
      model-server:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - anomaly-net

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - anomaly-net

  frontend:
    image: ${ECR_REGISTRY}/frontend:latest
    ports:
      - "4321:4321"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:9876
    depends_on:
      - backend
    networks:
      - anomaly-net

networks:
  anomaly-net:
    driver: bridge

volumes:
  qdrant_storage:
